name: shared-orchestration-required-backend

on:
  workflow_dispatch:
    inputs:
      mirrorgate_ref:
        description: Full matching MirrorGate commit SHA
        required: true
        type: string
      mirrors_ref:
        description: Full matching Mirrors commit SHA
        required: true
        type: string
      mirrorcpp_ref:
        description: Full matching MirrorCPP commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shared-orchestration-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  required-linux-bubblewrap:
    runs-on: [self-hosted, linux, x64, mirrorgate-bubblewrap]
    timeout-minutes: 45
    steps:
      - name: Validate full companion revisions
        env:
          GATE_REF: ${{ inputs.mirrorgate_ref }}
          MIRRORS_REF: ${{ inputs.mirrors_ref }}
          CPP_REF: ${{ inputs.mirrorcpp_ref }}
        run: |
          [[ "$GATE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MIRRORS_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CPP_REF" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: MirrorECMA

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NzSN/MirrorGate
          ref: ${{ inputs.mirrorgate_ref }}
          path: MirrorGate

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NzSN/Mirrors
          ref: ${{ inputs.mirrors_ref }}
          path: Mirrors

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NzSN/MirrorCPP
          ref: ${{ inputs.mirrorcpp_ref }}
          path: MirrorCPP

      - name: Verify prepared runner and install the locked TypeScript toolchain
        working-directory: MirrorECMA
        env:
          APALACHE_MC: ${{ vars.SHARED_ORCHESTRATION_APALACHE_MC }}
          MIRRORGATE_NODE_RUNTIME_ROOT: ${{ vars.SHARED_ORCHESTRATION_NODE_RUNTIME_ROOT }}
          MIRRORCPP_DEPENDENCY_CACHE: ${{ vars.SHARED_ORCHESTRATION_MIRRORCPP_DEPENDENCY_CACHE }}
        run: |
          [[ "$(node --version)" == "v24.15.0" ]]
          [[ "$(python3 --version)" == "Python 3.12."* ]]
          [[ "$(rustc --version)" == rustc\ 1.96.0\ * ]]
          [[ -x "$APALACHE_MC" ]]
          [[ -x "$MIRRORGATE_NODE_RUNTIME_ROOT/bin/node" ]]
          [[ -d "$MIRRORCPP_DEPENDENCY_CACHE/nlohmann_json-src" ]]
          bwrap --version
          (cd ../Mirrors && lake env lean --version)
          pnpm install --frozen-lockfile

      - name: Required shared orchestration matrix
        working-directory: MirrorECMA
        env:
          MIRRORECMA_ROOT: ${{ github.workspace }}/MirrorECMA
          MIRRORGATE_ROOT: ${{ github.workspace }}/MirrorGate
          MIRRORS_ROOT: ${{ github.workspace }}/Mirrors
          MIRRORCPP_ROOT: ${{ github.workspace }}/MirrorCPP
          MIRRORECMA_EXPECTED_REV: ${{ github.sha }}
          MIRRORGATE_EXPECTED_REV: ${{ inputs.mirrorgate_ref }}
          MIRRORS_EXPECTED_REV: ${{ inputs.mirrors_ref }}
          MIRRORCPP_EXPECTED_REV: ${{ inputs.mirrorcpp_ref }}
          APALACHE_MC: ${{ vars.SHARED_ORCHESTRATION_APALACHE_MC }}
          MIRRORGATE_NODE_RUNTIME_ROOT: ${{ vars.SHARED_ORCHESTRATION_NODE_RUNTIME_ROOT }}
          MIRRORCPP_DEPENDENCY_CACHE: ${{ vars.SHARED_ORCHESTRATION_MIRRORCPP_DEPENDENCY_CACHE }}
          MIRRORGATE_CONTROL_EVIDENCE: ${{ runner.temp }}/shared-orchestration-${{ github.run_id }}.jsonl
        run: bash tools/ci/shared-orchestration.sh

      - name: Record reproducibility evidence in the job summary
        env:
          EVIDENCE: ${{ runner.temp }}/shared-orchestration-${{ github.run_id }}.jsonl
        run: |
          [[ -s "$EVIDENCE" ]]
          [[ -s "$EVIDENCE.manifest.json" ]]
          {
            echo '## Shared orchestration required-backend evidence'
            echo '```jsonl'
            cat "$EVIDENCE"
            echo '```'
            echo '```json'
            cat "$EVIDENCE.manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
